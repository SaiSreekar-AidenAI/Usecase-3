server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the Cloud Run backend. __BACKEND_URL__ is
    # replaced at image-build time so the frontend and backend share one
    # browser-visible origin (no CORS, no baked-in apiBase in Angular).
    location /api/ {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host __BACKEND_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_read_timeout 300s;
    }

    # SPA routing — serve index.html for all non-file routes so the
    # Angular Router can handle deep links like /history/:id, /analytics/audit, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint for Cloud Run
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
