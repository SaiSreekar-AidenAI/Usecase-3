steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_FRONTEND_IMAGE_NAME}:v1'
      - '.'
images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_FRONTEND_IMAGE_NAME}:v1'
substitutions:
  # All injected by deploy.sh; kept here so the config is runnable standalone.
  _BACKEND_URL: ''
  _PROJECT_ID: 'resolve-490813'
  _REPO_NAME: 'resolve-repo'
  _FRONTEND_IMAGE_NAME: 'resolve-frontend'
  _REGION: 'us-central1'
options:
  dynamic_substitutions: true
